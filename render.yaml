services:
  - type: web
    name: mtc-event-registration
    runtime: node
    plan: free
  rootDir: .
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
